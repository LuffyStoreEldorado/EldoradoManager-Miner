name: EldoradoGames

on:
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run data fetching and merging script
        run: node generateGames.mjs

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push changes
        run: |
          # Add the output directory and its contents
          git add ./output

          # Check if there are any changes to commit
          git diff --quiet --exit-code || \
          (git commit -m "Update Eldorado Games data (Generated by workflow run ${{ github.run_id }})" && \
           git push)
        env:
          # Use the default GITHUB_TOKEN for pushing
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

