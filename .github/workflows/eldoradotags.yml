name: EldoradoTags

on:
  workflow_dispatch:

jobs:
  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run script
        run: node generateGames.mjs tags

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot (Tags)"
          git config user.email "actions@github.com"

      - name: Generate ISO Timestamp
        id: generate_timestamp
        run: echo "ISO_TIME=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> $GITHUB_OUTPUT

      - name: Commit and push EldoradoTags.json
        run: |
          git add ./output/EldoradoTags.json -f
          git commit -m "EldoradoTags.json (${{ steps.generate_timestamp.outputs.ISO_TIME }}) - Tags data update" || echo "No changes to commit for tags data"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}